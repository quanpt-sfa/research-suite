[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "9.0.0.dev0"
description = "Research Harness 9.0-dev: versioned research state, proposal gateway, dependency invalidation"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.17"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
research = "research_harness.cli:main"

[tool.setuptools.packages.find]
include = ["research_harness*"]

[tool.setuptools.package-data]
research_harness = ["legacy/VENDORED.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
