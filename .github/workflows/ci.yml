name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: test (${{ matrix.python-version }}${{ matrix.extras != '' && format(', {0}', matrix.extras) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        extras: [""]
        include:
          # Exact-tokenizer leg: with tiktoken installed, `estimate_tokens` stops reporting estimates, which is
          # the configuration in which the 9.1.1 usage-accounting defect (P1-3) shows up.
          - python-version: "3.12"
            extras: "tiktoken"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .[test]

    - name: Install optional exact tokenizer
      if: matrix.extras == 'tiktoken'
      run: |
        pip install tiktoken

    - name: Run Research Harness 9.0 test suite
      run: |
        pytest tests/ -v

    - name: Run legacy parity test suite
      run: |
        if [ -d "legacy_v8_4_4/Reusable_Research_Harness_Suite_v8.4.4_Novelty_Semantic_Execution" ]; then
          pytest legacy_v8_4_4/Reusable_Research_Harness_Suite_v8.4.4_Novelty_Semantic_Execution -v
        else
          echo "::warning::Legacy v8.4.4 test suite directory is not bundled in git repository checkout. In CI environment, legacy test execution is classified as NOT_VERIFIABLE. Pinned local execution verified 105/105 passed (33.05s). See docs/LEGACY_SEMANTIC_PARITY.md."
        fi
