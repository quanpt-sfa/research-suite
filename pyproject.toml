[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "9.0.0"
description = "Research Harness 9.0: versioned research state, proposal gateway, dependency invalidation"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.17"]

[project.optional-dependencies]
test = ["pytest>=7"]
model = ["anthropic>=1.0"]

[project.scripts]
research = "research_harness.cli:main"

[tool.setuptools.packages.find]
include = ["research_harness*"]

[tool.setuptools.package-data]
research_harness = [
    "legacy/VENDORED.json",
    "workflows/skills/*/*.md",
    "taxonomy/*.json",
    "workflows/domain_specs/*.json",
    "workflows/protocols_data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
